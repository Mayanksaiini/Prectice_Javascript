<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Lucida Sans', sans-serif;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background-color: antiquewhite;
        }

        #main {
            padding: 30px;
            width: 100%;
            min-height: 100vh;
        }

        input {
            display: block;
            margin-top: 10px;
            padding: 8px;
        }

        .card {
            margin-top: 40px;
            padding: 20px;
            display: inline-block;
            border: 1px solid black;
            border-radius: 10px;
            width: 250px;
            vertical-align: top;
            overflow-wrap: break-word;
            background-color: white;
        }

        .profile {
            width: 40px;
            height: 40px;
            background-color: yellow;
            border-radius: 50%;
            margin-bottom: 7px;
            overflow: hidden;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card h5 {
            margin-top: 5px;
        }

        .card p {
            font-size: 12px;
            margin-top: 10px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div id="main">

        <form action="">
            <input type="text" placeholder="Profile image">
            <input type="text" placeholder="Name">
            <input type="text" placeholder="Age">
            <input type="text" placeholder="Story">
            <input type="submit">
        </form>

        <div class="card">
            <div class="profile"><img src="https://unsplash.com/collections/Qcw65IBITww" alt=""></div>

            <h3>Mayank</h3>
            <h5>Coder</h5>

            <p>
                Lorem ipsum dolor, sit amet consectetur adipisicing elit.
                Quaerat odio explicabo eaque totam nemo?
                Veritatis excepturi quisquam iste, omnis aut explicabo
                delectus minima aspernatur ratione voluptates voluptas
                amet asperiores sapiente?
            </p>
        </div>

    </div>

    <script src="submit.js"></script>

</body>

</html>
