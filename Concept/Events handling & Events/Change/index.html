<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            box-sizing: border-box;
            background-color: antiquewhite;
        }

        html,
        body {
            width: 100%;
            height: 100%;

        }

        #main {
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            display: flex;
            background-color: rgb(127, 85, 23);
        }

        input {
            display: none;
        }

        #btn {
            padding: 12px 22px;
            background-color: brown;
            color: aliceblue;
            border-radius: 5px;

        }


        #btn:hover {
            background-color: rgb(45, 28, 28);
        }
    </style>
</head>

<body>
    <div id="main">

        <input id="fileinp" type="file">
        <div id="btn">Upload file</div>
    </div>

    <script src="Change.js"></script>
</body>

</html>
